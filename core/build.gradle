plugins {
    id 'java-library'
}

group = 'com.mhgandhi'
version = '2.0'

repositories {
    mavenCentral()
}

dependencies {
    // Your core exposes JDA types in public methods/constructors.
    api('net.dv8tion:JDA:5.0.0') {
        exclude group: 'club.minnced', module: 'opus-java'
    }
    api 'club.minnced:discord-webhooks:0.8.4'

    implementation 'org.xerial:sqlite-jdbc:3.46.0.1'

    // Explicit dependency if core still directly imports Gson.
    implementation 'com.google.code.gson:gson:2.11.0'

    // Provided by Paper at runtime; do not shade another Adventure copy.
    compileOnlyApi 'net.kyori:adventure-api:4.24.0'
    compileOnly 'net.kyori:adventure-text-minimessage:4.24.0'
    compileOnly 'net.kyori:adventure-text-serializer-plain:4.24.0'

    compileOnly 'org.jetbrains:annotations:26.0.2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(21)
}